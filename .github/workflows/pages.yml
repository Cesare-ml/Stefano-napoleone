name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify image assets
        run: |
          test -s assets/images/stefano-napoleone-ritratto.webp
          test -s assets/images/stefano-napoleone-reiki-sessione.webp
          test -s assets/images/stefano-napoleone-reiki-dettaglio.webp
          file assets/images/*.webp

      - name: Bust browser cache
        run: |
          sed -i 's|assets/styles.css"|assets/styles.css?v=13"|g' index.html
          sed -i 's|assets/app.js"|assets/app.js?v=13"|g' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
