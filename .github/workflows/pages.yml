name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify responsive photo sources
        shell: bash
        run: |
          set -euo pipefail

          # Desktop: fotografie JPG originali caricate nel repository.
          test -s assets/images/stefano-ritratto.jpg
          test -s assets/images/stefano-reiki.jpg
          test -s assets/images/mani-reiki.jpg

          # Mobile: copie WebP leggere già verificate.
          test -s assets/images/stefano-napoleone-ritratto.webp
          test -s assets/images/stefano-napoleone-reiki-sessione.webp
          test -s assets/images/stefano-napoleone-reiki-dettaglio.webp

          file \
            assets/images/stefano-ritratto.jpg \
            assets/images/stefano-reiki.jpg \
            assets/images/mani-reiki.jpg \
            assets/images/stefano-napoleone-ritratto.webp \
            assets/images/stefano-napoleone-reiki-sessione.webp \
            assets/images/stefano-napoleone-reiki-dettaglio.webp

      - name: Prepare deploy artifact
        run: |
          rm -rf assets/image-source
          sed -E -i 's|assets/styles.css(\?v=[0-9]+)?|assets/styles.css?v=33|g' index.html
          sed -E -i 's|assets/app.js(\?v=[0-9]+)?|assets/app.js?v=33|g' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
