name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build high-resolution portrait
        shell: bash
        run: |
          cat assets/image-source/portrait-hq/part-*.b64 \
            | tr -d '\n\r ' \
            | base64 --decode \
            > assets/images/stefano-napoleone-ritratto.webp
          echo "2440dd3de666988b3b93bc55e69b85b3451fd67a69c3576d452d5c2a22a1f3ce  assets/images/stefano-napoleone-ritratto.webp" | sha256sum --check
          test "$(stat -c%s assets/images/stefano-napoleone-ritratto.webp)" -eq 44388
          file assets/images/stefano-napoleone-ritratto.webp

      - name: Verify image assets
        run: |
          test -s assets/images/stefano-napoleone-ritratto.webp
          test -s assets/images/stefano-napoleone-reiki-sessione.webp
          test -s assets/images/stefano-napoleone-reiki-dettaglio.webp
          file assets/images/*.webp

      - name: Prepare deploy artifact
        run: |
          rm -rf assets/image-source
          sed -E -i 's|assets/styles.css(\?v=[0-9]+)?|assets/styles.css?v=21|g' index.html
          sed -E -i 's|assets/app.js(\?v=[0-9]+)?|assets/app.js?v=21|g' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
